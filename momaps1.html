<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0000ee;
    color: white;
  }

  mark {
    background-color: #0000ee;
    color: #fff200
  }
  .ig-grid, .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1080px;
    margin: 0 auto;
  }

  .ig-grid .instagram-media {
    margin: 0 !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100% !important;
  }

  .video-card {
    width: 100%;
  }

  /* Stack to a single column on narrow screens */
  @media (max-width: 900px) {
    .ig-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 600px) {
    .ig-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
